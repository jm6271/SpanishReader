name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build WinUI app (Release x64)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore app
        run: dotnet restore SpanishReader/SpanishReader.csproj -p:Platform=x64

      # Serialize XAML compilation to avoid intermittent compiler failures.
      - name: Build app
        run: dotnet build SpanishReader/SpanishReader.csproj --configuration Release --no-restore -p:Platform=x64 -m:1 -p:UseSharedCompilation=false

  test:
    name: Test Core (Release x64)
    # Translation tests load the native Bergamot library and bundled model.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        run: dotnet restore SpanishReader.Core.Tests/SpanishReader.Core.Tests.csproj -p:Platform=x64

      - name: Run tests
        run: dotnet test SpanishReader.Core.Tests/SpanishReader.Core.Tests.csproj --configuration Release --no-restore -p:Platform=x64 --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: core-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
